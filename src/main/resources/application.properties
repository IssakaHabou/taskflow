# =====================================================================
#  TaskFlow - configuration par défaut (profil "default", base H2)
#  Toutes les valeurs ${VAR:defaut} peuvent être surchargées par des
#  variables d'environnement définies dans le panneau Cloud Clusters.
# =====================================================================
spring.application.name=TaskFlow

# Port : la plateforme PaaS peut imposer le sien via la variable PORT
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.compression.enabled=true

# --- Base H2 embarquée (fichier) : aucune installation nécessaire ---
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/taskflow}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Création / mise à jour automatique du schéma
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Console H2 (désactivée par défaut en production : H2_CONSOLE=true pour l'activer)
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# Données de démonstration au premier démarrage
taskflow.demo-data=${DEMO_DATA:true}

# --- Supervision (Actuator) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.java.enabled=true
management.info.os.enabled=true
management.info.build.enabled=true

# Format des dates des formulaires (champ HTML type="date" = ISO yyyy-MM-dd)
spring.mvc.format.date=iso

# Format JSON des dates
spring.jackson.serialization.write-dates-as-timestamps=false

# Logs
logging.level.root=INFO
logging.level.ci.inphb.taskflow=INFO
