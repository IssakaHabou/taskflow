# =====================================================================
#  Profil "mysql" : activer avec SPRING_PROFILES_ACTIVE=mysql
#  Renseigner les variables DB_HOST, DB_PORT, DB_NAME, DB_USERNAME,
#  DB_PASSWORD (valeurs affichées dans le panneau Cloud Clusters),
#  ou directement DB_URL.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskflow}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
