# =====================================================================
#  Profil "postgres" : activer avec SPRING_PROFILES_ACTIVE=postgres
#  Renseigner DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
#  (ou directement DB_URL).
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
